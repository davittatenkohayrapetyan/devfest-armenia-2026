server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The container publishes on a non-80 host port, so nginx's default absolute redirects
  # (http://host/path/, port dropped) point somewhere unreachable. Relative redirects keep
  # the scheme, host and port the client actually used. Matters for /implementation-progress,
  # which is a directory and therefore always redirects to its trailing-slash form.
  absolute_redirect off;

  location /content/ {
    add_header Cache-Control "no-cache";
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
